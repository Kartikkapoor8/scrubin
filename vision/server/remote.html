<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>VIPER remote</title>
<style>
  :root { --cyan: #3fe0ff; --green: #4dffb0; --amber: #ffb547; --red: #ff4d5e; --ink: #05080c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--ink); color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  body { display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; min-height: 54px; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--red); }
  .on .dot { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .where { flex: 1; min-width: 0; }
  .step { font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { margin-top: 2px; font: 500 13px ui-monospace, Menlo, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.6); }
  button { appearance: none; border: 0; border-radius: 18px; color: #fff; font: inherit; font-weight: 800; letter-spacing: 0.04em; touch-action: none; }
  #next { flex: 5; font-size: 54px; color: var(--ink); background: var(--cyan); box-shadow: 0 0 44px rgba(63,224,255,0.35); }
  #next:active, #next.hit { transform: scale(0.985); filter: brightness(1.25); }
  #talk { flex: 3; font-size: 30px; background: #101a22; border: 2px solid rgba(77,255,176,0.6); color: var(--green); }
  #talk small { display: block; margin-top: 6px; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; color: rgba(255,255,255,0.6); }
  #talk.down { background: var(--green); color: var(--ink); box-shadow: 0 0 44px rgba(77,255,176,0.45); }
  #talk.down small { color: rgba(5,8,12,0.75); }
  .row { flex: 1.5; display: flex; gap: 12px; min-height: 74px; }
  #back { flex: 1; font-size: 20px; background: #101a22; border: 2px solid rgba(255,255,255,0.22); }
  #reset { flex: 2; font-size: 24px; background: #1c0f12; border: 2px solid rgba(255,77,94,0.7); color: var(--red); }
  #back:active, #reset:active { filter: brightness(1.6); }
  #gate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; background: var(--ink); text-align: center; }
  #gate.show { display: flex; }
  #gate h1 { margin: 0; font-size: 34px; letter-spacing: 0.3em; padding-left: 0.3em; }
  #gate p { margin: 0; max-width: 300px; font-size: 16px; line-height: 1.4; color: rgba(255,255,255,0.7); }
  #pin { width: 210px; padding: 14px; font: 700 40px ui-monospace, Menlo, monospace; letter-spacing: 0.3em; text-align: center; color: #fff; background: #101a22; border: 2px solid rgba(63,224,255,0.5); border-radius: 14px; outline: none; -webkit-user-select: text; user-select: text; }
  #go { width: 210px; padding: 16px; font-size: 20px; color: var(--ink); background: var(--cyan); }
  #err { min-height: 20px; color: var(--amber); font-size: 15px; }
</style>
</head>
<body>
  <header id="bar">
    <span class="dot"></span>
    <div class="where">
      <div class="step" id="step">Connecting…</div>
      <div class="sub" id="sub">VIPER remote</div>
    </div>
  </header>
  <button id="next">NEXT</button>
  <button id="talk">HOLD TO TALK<small id="talkhint">ask the attending</small></button>
  <div class="row">
    <button id="back">BACK</button>
    <button id="reset">RESET</button>
  </div>

  <div id="gate">
    <h1>VIPER</h1>
    <p>Enter the PIN shown on the Mac (press <b>?</b> there to see it).</p>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" />
    <button id="go">Connect</button>
    <div id="err"></div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const bar = $('bar'), gate = $('gate'), pinInput = $('pin'), err = $('err');
  let socket = null, pin = '', retry = 500, talking = false, wasOpen = false;
  try { pin = localStorage.getItem('viper.pin') || ''; } catch (e) {}
  const fromLink = new URLSearchParams(location.search).get('pin');
  if (fromLink) pin = fromLink;

  const send = (message) => { if (socket && socket.readyState === 1) socket.send(JSON.stringify(message)); };
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  function connect() {
    if (!pin) { gate.classList.add('show'); pinInput.focus(); return; }
    wasOpen = false;
    socket = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/remote?pin=' + encodeURIComponent(pin));
    socket.onopen = () => {
      wasOpen = true; retry = 500;
      bar.classList.add('on'); gate.classList.remove('show'); err.textContent = '';
      try { localStorage.setItem('viper.pin', pin); } catch (e) {}
      $('step').textContent = 'Connected'; $('sub').textContent = 'Waiting for VIPER Vision';
    };
    socket.onmessage = (event) => {
      let m; try { m = JSON.parse(event.data); } catch (e) { return; }
      if (m.t === 'state') {
        $('step').textContent = m.title || 'VIPER';
        $('sub').textContent = [m.index, m.sutures, m.attending].filter(Boolean).join('  ·  ');
      } else if (m.t === 'hello' && !m.app) {
        $('sub').textContent = 'Open VIPER Vision on the Mac';
      }
    };
    socket.onclose = () => {
      bar.classList.remove('on');
      if (talking) setTalk(false);
      if (!wasOpen) {
        // Never opened: almost always a wrong PIN.
        pin = ''; try { localStorage.removeItem('viper.pin'); } catch (e) {}
        err.textContent = 'That PIN was not accepted.'; gate.classList.add('show');
        return;
      }
      $('step').textContent = 'Reconnecting…';
      setTimeout(connect, retry); retry = Math.min(retry * 1.6, 4000);
    };
  }

  $('go').onclick = () => { pin = pinInput.value.trim(); err.textContent = ''; connect(); };
  pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').onclick(); });

  const press = (button, command) => button.addEventListener('pointerdown', (e) => {
    e.preventDefault(); buzz(15); send({ t: command });
    button.classList.add('hit'); setTimeout(() => button.classList.remove('hit'), 140);
  });
  press($('next'), 'next'); press($('back'), 'back'); press($('reset'), 'reset');

  const talk = $('talk');
  function setTalk(on) {
    if (on === talking) return;
    talking = on; talk.classList.toggle('down', on);
    $('talkhint').textContent = on ? 'listening: release to send' : 'ask the attending';
    send({ t: 'talk', on }); buzz(on ? 25 : 10);
  }
  talk.addEventListener('pointerdown', (e) => { e.preventDefault(); try { talk.setPointerCapture(e.pointerId); } catch (x) {} setTalk(true); });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) talk.addEventListener(type, () => setTalk(false));
  document.addEventListener('visibilitychange', () => { if (document.hidden) setTalk(false); });
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  connect();
})();
</script>
</body>
</html>
